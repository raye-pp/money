<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<title>레이야 돈 모으자</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --ink: #22252B; --paper: #F6F5F1; --paper-deep: #ECEAE3; --card: #FDFCFA;
  --accent: #F2B33D; --accent-soft: #FCEFD2; --muted: #6B6963; --line: #C9C7C0;
  --line-soft: #E2E0D9; --danger: #B4442E;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; }
.hidden { display: none !important; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 5; background: var(--paper); display: flex; align-items: center; gap: 8px; padding: 12px 16px; min-height: 60px; }
.bar h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 800; letter-spacing: -0.3px; }
.bar .back { border: 0; background: none; font-size: 22px; padding: 4px 8px 4px 0; line-height: 1; }
.btn-accent { background: var(--accent); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 12px; padding: 8px 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.btn-text { border: 0; background: none; padding: 8px; color: var(--muted); }
.btn-text.danger, .danger { color: var(--danger); }
.btn-outline { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; }

main { padding: 0 16px calc(96px + var(--safe-b)); }
main.no-tab { padding-bottom: calc(32px + var(--safe-b)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; }
.card + .card { margin-top: 14px; }
.sec { font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 0 4px; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 5px 0; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 700; text-align: right; }
.kv.click { cursor: pointer; }
.divider { border: 0; border-top: 1px solid var(--line-soft); margin: 6px 0; }
.neg { color: var(--danger); }
.hint { font-size: 13px; color: var(--muted); }

/* period row */
.period-row { display: flex; align-items: center; gap: 2px; }
.period-row .k { color: var(--muted); margin-right: 4px; }
.icon-btn { border: 0; background: none; width: 40px; height: 40px; border-radius: 20px; font-size: 16px; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:active { background: var(--paper-deep); }
.period-btn { flex: 1; border: 0; background: none; font-weight: 700; padding: 8px 0; text-align: center; }
.period-edit { display: flex; align-items: center; gap: 6px; padding: 6px 0 10px; flex-wrap: wrap; }
.period-edit input { flex: 1; min-width: 130px; }

/* list rows */
.list { list-style: none; margin: 0; padding: 0; }
.row { padding: 10px 4px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.row:active { background: var(--paper-deep); }
.l1, .l2 { display: flex; align-items: center; gap: 8px; }
.l1 .sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l1 .amt { font-weight: 700; white-space: nowrap; }
.l2 { min-height: 30px; }
.l2 .meta { flex: 1; font-size: 14px; color: var(--muted); }
.l2 .del { border: 0; background: none; color: var(--danger); font-size: 14px; padding: 4px 8px; }
.chip { font-size: 13px; font-weight: 700; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.chip.EXPENSE { background: var(--ink); color: var(--paper); }
.chip.INCOME { background: var(--accent); color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 48px 0; white-space: pre-line; }
.month-head { display: flex; align-items: center; gap: 8px; background: var(--paper-deep); border-radius: 8px; padding: 8px 12px; margin-top: 14px; }
.month-head b { flex: 1; }
.month-head span { font-size: 14px; color: var(--muted); }

/* forms */
.field { display: block; margin-top: 16px; }
.field > .label { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.input, .field input[type=text], .field input[type=date], .field input[type=datetime-local], .field select, .field textarea, .input-plain {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; background: #FFFEFB; outline: none;
}
.input-plain { width: auto; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); }
.field textarea { min-height: 96px; resize: vertical; }
.with-suffix { position: relative; }
.with-suffix input { padding-right: 36px; }
.with-suffix .suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.counter { text-align: right; font-size: 13px; color: var(--muted); margin-top: 4px; }
.error-text { font-size: 13px; color: var(--danger); margin-top: 4px; }
.field.has-error input, .field.has-error select { border-color: var(--danger); }
.seg { display: flex; border: 1.5px solid var(--ink); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: #FFFEFB; padding: 11px 0; color: var(--muted); }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); font-weight: 700; }
.attach-box { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 12px; background: #FFFEFB; margin-bottom: 8px; }
.attach-box span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; text-align: center; }
.save { width: 100%; margin-top: 24px; padding: 14px; font-size: 17px; }

/* detail */
.big-amt { font-size: 32px; font-weight: 800; margin: 4px 0 14px; }
.detail-text { white-space: pre-wrap; word-break: break-word; }
.thumb { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; background: var(--paper-deep); display: block; cursor: zoom-in; }
.viewer { position: fixed; inset: 0; background: #111; z-index: 30; display: flex; align-items: center; justify-content: center; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* stats */
.bar-row { padding: 6px 0; }
.track { height: 10px; border-radius: 5px; background: var(--paper-deep); margin-top: 4px; overflow: hidden; }
.fill { height: 100%; border-radius: 5px; background: var(--ink); }
.card-title { font-weight: 700; color: var(--muted); font-size: 14px; margin-bottom: 4px; }

/* history */
.search { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; background: #FFFEFB; }
.filters { display: flex; gap: 8px; padding: 10px 0 2px; }
.filters button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; }
.filters button.on { background: var(--accent-soft); border-color: var(--ink); font-weight: 700; }

/* settings */
.cat-row { display: flex; align-items: center; border-bottom: 1px solid var(--line-soft); padding: 2px 0; }
.cat-row span { flex: 1; }
.add-row { display: flex; gap: 8px; margin-top: 14px; }
.add-row input { flex: 1; min-width: 0; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: flex; }
.tabbar a { flex: 1; text-align: center; padding: 10px 0 12px; text-decoration: none; color: var(--muted); font-size: 13px; }
.tabbar a .ic { display: block; font-size: 20px; line-height: 1.2; }
.tabbar a.on { color: var(--ink); font-weight: 700; }
.tabbar a.on .ic { background: var(--accent-soft); border-radius: 999px; margin: 0 auto 2px; width: 56px; }

/* modal + toast */
.modal-back { position: fixed; inset: 0; background: rgba(20, 22, 26, 0.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px 20px calc(16px + var(--safe-b)); }
.modal h3 { margin: 0 0 8px; font-size: 18px; }
.modal p { margin: 0 0 8px; color: #34373E; white-space: pre-line; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.modal .actions button { min-width: 72px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; z-index: 40; font-size: 14px; max-width: 90vw; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ================= 저장소 (IndexedDB, 이 기기의 크롬 안에만 저장) ================= */
const DB_NAME = 'don-moeuja';
const DEFAULT_CATEGORIES = ['식비', '간식', '교통', '문구', '용돈', '저축'];
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (ev) => {
      const d = req.result;
      if (ev.oldVersion < 1) {
        d.createObjectStore('entries', { keyPath: 'id', autoIncrement: true });
        const cats = d.createObjectStore('categories', { keyPath: 'id', autoIncrement: true });
        d.createObjectStore('kv', { keyPath: 'key' });
        DEFAULT_CATEGORIES.forEach((name, i) => cats.add({ name, sortOrder: i }));
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function run(stores, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(stores, mode);
    let result;
    Promise.resolve(fn(t)).then((r) => { result = r; });
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getAll = (store) => run([store], 'readonly', (t) => reqP(t.objectStore(store).getAll()));
const putOne = (store, obj) => run([store], 'readwrite', (t) => reqP(t.objectStore(store).put(obj)));
const delOne = (store, id) => run([store], 'readwrite', (t) => { t.objectStore(store).delete(id); });

/* ================= 상태 ================= */
const S = {
  entries: [],
  categories: [],
  settings: null, // { start, end, budget, collapsed }
  stats: null,    // { start, end } — 통계 화면만의 기간
  history: { filter: 'ALL', query: '' },
  edit: null,
  periodEditing: false,
};

function defaultSettings() {
  const t = new Date();
  return { start: ymd(new Date(t.getFullYear(), t.getMonth(), 1)), end: ymd(new Date(t.getFullYear(), t.getMonth() + 1, 0)), budget: 0, collapsed: false };
}

async function loadAll() {
  const [entries, cats, kv] = await Promise.all([getAll('entries'), getAll('categories'), getAll('kv')]);
  S.entries = entries;
  S.categories = cats.sort((a, b) => a.sortOrder - b.sortOrder || a.id - b.id);
  const s = kv.find((x) => x.key === 'settings');
  S.settings = Object.assign(defaultSettings(), s ? s.value : {});
}
const saveSettings = () => putOne('kv', { key: 'settings', value: S.settings });

/* ================= 형식 ================= */
const TYPE = { EXPENSE: '지출', INCOME: '수입' };
const PAY = { CASH: '현금', CARD: '카드' };
const UNCAT = '미분류';
const MAX_SUMMARY = 15, MAX_DETAIL = 200, MAX_CAT = 10, MAX_DIGITS = 12;

const pad = (n) => String(n).padStart(2, '0');
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function localDT(ms) { const d = new Date(ms); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const short = (s) => s.slice(5).replace('-', '/');
const shortMs = (ms) => short(ymd(new Date(ms)));
const fullMs = (ms) => localDT(ms).replace('T', ' ');
const num = (n) => Number(n).toLocaleString('ko-KR');
const won = (n) => `${num(n)}원`;
const signed = (e) => (e.type === 'EXPENSE' ? '−' : '+') + num(e.amount);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const digitsOf = (v) => String(v).replace(/\D/g, '').replace(/^0+/, '').slice(0, MAX_DIGITS);

function inPeriod(e, start, end) {
  const from = parseYmd(start).getTime();
  const to = parseYmd(end); to.setDate(to.getDate() + 1);
  return e.occurredAt >= from && e.occurredAt < to.getTime();
}
const catName = (id) => (S.categories.find((c) => c.id === id) || {}).name || UNCAT;
const byCreatedDesc = (a, b) => b.createdAt - a.createdAt || b.id - a.id;
const byOccurredDesc = (a, b) => b.occurredAt - a.occurredAt || b.createdAt - a.createdAt;

/** ◀ ▶ : 같은 길이만큼 이동 (1일~말일 기간이면 달 단위) */
function shiftPeriod(start, end, dir) {
  const s = parseYmd(start), e = parseYmd(end);
  const lastOfE = new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate();
  if (s.getDate() === 1 && e.getDate() === lastOfE) {
    const months = (e.getFullYear() - s.getFullYear()) * 12 + e.getMonth() - s.getMonth() + 1;
    const ns = new Date(s.getFullYear(), s.getMonth() + months * dir, 1);
    const ne = new Date(ns.getFullYear(), ns.getMonth() + months, 0);
    return [ymd(ns), ymd(ne)];
  }
  const days = Math.round((e - s) / 86400000) + 1;
  const ns = new Date(s); ns.setDate(ns.getDate() + days * dir);
  const ne = new Date(e); ne.setDate(ne.getDate() + days * dir);
  return [ymd(ns), ymd(ne)];
}

/* ================= 공통 UI ================= */
const app = document.getElementById('app');
let objectUrls = [];
function blobUrl(blob) { const u = URL.createObjectURL(blob); objectUrls.push(u); return u; }

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/** 아래에서 올라오는 창. buttons: [{label, value, cls}] → 누른 value로 resolve */
function modal({ title, message = '', bodyHtml = '', buttons, onOpen }) {
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ''}${bodyHtml}
      <div class="actions">${buttons.map((b, i) => `<button data-i="${i}" class="${b.cls || 'btn-text'}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const close = (v) => { back.remove(); resolve(v); };
    back.addEventListener('click', (ev) => {
      if (ev.target === back) return close(null);
      const b = ev.target.closest('button[data-i]');
      if (!b) return;
      const btn = buttons[+b.dataset.i];
      if (btn.check && !btn.check(back)) return;
      close(btn.value);
    });
    document.body.appendChild(back);
    if (onOpen) onOpen(back);
  });
}
const confirmDelete = (title, message) =>
  modal({ title, message, buttons: [{ label: '취소', value: false }, { label: '삭제', value: true, cls: 'btn-text danger' }] });

function entryRow(e, withDelete) {
  const meta = [shortMs(e.occurredAt), catName(e.categoryId), e.payment ? PAY[e.payment] : '—'].join(' · ');
  return `<li class="row" data-open="${e.id}">
    <div class="l1"><span class="chip ${e.type}">${TYPE[e.type]}</span><span class="sum">${esc(e.summary || '(요약 없음)')}</span><span class="amt">${signed(e)}</span></div>
    <div class="l2"><span class="meta">${esc(meta)}</span>${withDelete ? `<button class="del" data-del="${e.id}">삭제</button>` : ''}</div>
  </li>`;
}

function tabbar(cur) {
  const tabs = [['home', '⌂', '홈'], ['history', '☰', '기록'], ['stats', '▤', '통계'], ['settings', '⚙', '설정']];
  return `<div class="tabbar"><nav>${tabs.map(([r, ic, l]) =>
    `<a href="#/${r}" class="${cur === r ? 'on' : ''}"><span class="ic" aria-hidden="true">${ic}</span>${l}</a>`).join('')}</nav></div>`;
}

/* ================= 화면: 홈 ================= */
function viewHome() {
  const s = S.settings;
  const list = S.entries.filter((e) => inPeriod(e, s.start, s.end)).sort(byCreatedDesc);
  const exp = list.filter((e) => e.type === 'EXPENSE').reduce((a, e) => a + e.amount, 0);
  const inc = list.filter((e) => e.type === 'INCOME').reduce((a, e) => a + e.amount, 0);
  const remain = s.budget - exp + inc;
  return `
  <header class="bar"><h1>레이야 돈 모으자</h1><a class="btn-accent" href="#/edit">+ 추가하기</a></header>
  <main>
    <section class="card">
      <div class="period-row">
        <span class="k">기간</span>
        <button class="icon-btn" data-act="period-prev" aria-label="이전 기간">◀</button>
        <button class="period-btn" data-act="period-edit">${short(s.start)} ~ ${short(s.end)}</button>
        <button class="icon-btn" data-act="period-next" aria-label="다음 기간">▶</button>
        <button class="icon-btn" data-act="toggle" aria-label="${s.collapsed ? '펼치기' : '접기'}">${s.collapsed ? '▼' : '▲'}</button>
      </div>
      <div class="period-edit ${S.periodEditing ? '' : 'hidden'}">
        <input type="date" class="input" id="p-start" value="${s.start}"> ~
        <input type="date" class="input" id="p-end" value="${s.end}">
        <button class="btn-accent" data-act="period-apply">적용</button>
      </div>
      <div class="${s.collapsed ? 'hidden' : ''}">
        <div class="kv click" data-act="budget"><span class="k">예산</span><span class="v ${s.budget ? '' : 'hint'}">${s.budget ? won(s.budget) : '눌러서 입력'}</span></div>
        <div class="kv"><span class="k">총지출</span><span class="v">${won(exp)}</span></div>
        <div class="kv"><span class="k">추가수입</span><span class="v">${won(inc)}</span></div>
        <hr class="divider">
        <div class="kv"><span class="k">남은 예산</span><span class="v ${remain < 0 ? 'neg' : ''}">${remain < 0 ? '−' : ''}${won(Math.abs(remain))}</span></div>
      </div>
    </section>
    <h2 class="sec">목록 · 최신순</h2>
    ${list.length ? `<ul class="list">${list.map((e) => entryRow(e, true)).join('')}</ul>`
      : `<div class="empty">이 기간에 입력한 내역이 없어요.\n오른쪽 위 [추가하기]로 시작해 보세요.</div>`}
  </main>${tabbar('home')}`;
}

/* ================= 화면: 기록 (전체 내역, 월별) ================= */
function historyGroups() {
  const { filter, query } = S.history;
  const q = query.trim().toLowerCase();
  const list = S.entries
    .filter((e) => filter === 'ALL' || e.type === filter)
    .filter((e) => !q || e.summary.toLowerCase().includes(q) || e.detail.toLowerCase().includes(q))
    .sort(byOccurredDesc);
  const groups = new Map();
  for (const e of list) {
    const d = new Date(e.occurredAt);
    const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    if (!groups.has(key)) groups.set(key, { y: d.getFullYear(), m: d.getMonth() + 1, items: [] });
    groups.get(key).items.push(e);
  }
  return [...groups.values()];
}
function historyListHtml() {
  const groups = historyGroups();
  const { filter, query } = S.history;
  if (!groups.length) return `<div class="empty">${query.trim() ? `‘${esc(query.trim())}’에 맞는 기록이 없어요` : '아직 기록이 없어요'}</div>`;
  return groups.map((g) => {
    const exp = g.items.filter((e) => e.type === 'EXPENSE').reduce((a, e) => a + e.amount, 0);
    const inc = g.items.filter((e) => e.type === 'INCOME').reduce((a, e) => a + e.amount, 0);
    const totals = [filter !== 'INCOME' ? `지출 ${num(exp)}` : '', filter !== 'EXPENSE' ? `수입 ${num(inc)}` : ''].filter(Boolean).join(' · ');
    return `<div class="month-head"><b>${g.y}년 ${g.m}월</b><span>${totals}</span></div>
      <ul class="list">${g.items.map((e) => entryRow(e, false)).join('')}</ul>`;
  }).join('');
}
function viewHistory() {
  const f = S.history.filter;
  return `
  <header class="bar"><h1>기록</h1></header>
  <main>
    <input type="search" class="search" id="h-search" placeholder="요약 · 상세 내역 검색" value="${esc(S.history.query)}">
    <div class="filters">${[['ALL', '전체'], ['EXPENSE', '지출'], ['INCOME', '수입']].map(([k, l]) =>
      `<button data-filter="${k}" class="${f === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div id="h-list">${historyListHtml()}</div>
  </main>${tabbar('history')}`;
}

/* ================= 화면: 통계 ================= */
function bars(rows) {
  if (!rows.length) return `<div class="hint" style="padding:6px 0">이 기간에 지출 내역이 없어요</div>`;
  const max = Math.max(...rows.map((r) => r[1]));
  return rows.map(([label, v]) => `<div class="bar-row">
    <div class="kv" style="padding:0"><span>${esc(label)}</span><span class="v">${won(v)}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(2, (v / max) * 100)}%"></div></div></div>`).join('');
}
function viewStats() {
  if (!S.stats) S.stats = { start: S.settings.start, end: S.settings.end };
  const { start, end } = S.stats;
  const list = S.entries.filter((e) => inPeriod(e, start, end));
  const expList = list.filter((e) => e.type === 'EXPENSE');
  const sum = (arr) => arr.reduce((a, e) => a + e.amount, 0);
  const groupSum = (arr, keyFn) => {
    const m = new Map();
    arr.forEach((e) => m.set(keyFn(e), (m.get(keyFn(e)) || 0) + e.amount));
    return [...m.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  };
  const byPay = groupSum(expList, (e) => (e.payment ? PAY[e.payment] : '—'));
  const byCat = groupSum(expList, (e) => catName(e.categoryId));
  const isHome = start === S.settings.start && end === S.settings.end;
  return `
  <header class="bar"><h1>통계</h1></header>
  <main>
    <section class="card">
      <div class="period-edit" style="padding:4px 0">
        <input type="date" class="input" id="s-start" value="${start}"> ~
        <input type="date" class="input" id="s-end" value="${end}">
      </div>
      <div class="kv" style="padding:0">
        <span class="hint">${isHome ? '홈에서 설정한 기간이에요' : '홈 기간과 다른 기간이에요'}</span>
        ${isHome ? '' : '<button class="btn-text" data-act="stats-reset">홈 기간으로</button>'}
      </div>
    </section>
    <section class="card">
      <div class="kv"><span class="k">총지출</span><span class="v">${won(sum(expList))}</span></div>
      <div class="kv"><span class="k">총수입</span><span class="v">${won(sum(list.filter((e) => e.type === 'INCOME')))}</span></div>
    </section>
    <section class="card"><div class="card-title">결제수단별 (지출)</div>${bars(byPay)}</section>
    <section class="card"><div class="card-title">카테고리별 (지출)</div>${bars(byCat)}</section>
  </main>${tabbar('stats')}`;
}

/* ================= 화면: 설정 ================= */
function viewSettings() {
  return `
  <header class="bar"><h1>설정</h1></header>
  <main>
    <h2 class="sec" style="margin-top:4px">카테고리</h2>
    <div>${S.categories.map((c) => `<div class="cat-row"><span>${esc(c.name)}</span>
      <button class="btn-text" data-cat-edit="${c.id}">수정</button>
      <button class="btn-text danger" data-cat-del="${c.id}">삭제</button></div>`).join('')}</div>
    <div class="add-row">
      <input type="text" class="input" id="cat-new" maxlength="${MAX_CAT}" placeholder="새 카테고리 이름 (최대 ${MAX_CAT}자)">
      <button class="btn-accent" data-act="cat-add">추가</button>
    </div>
    <p class="hint">카테고리는 1단계로만 관리돼요. 지출과 수입이 같은 목록을 함께 써요.</p>

    <h2 class="sec" style="margin-top:28px">데이터 백업</h2>
    <section class="card">
      <p class="hint" style="margin:0 0 10px">입력한 내용은 이 폰의 크롬 안에만 저장돼요. 크롬의 사이트 데이터를 지우거나 폰을 바꾸면 사라지니, 가끔 백업 파일로 내보내 두세요.</p>
      <div class="btn-row">
        <button class="btn-outline" data-act="export">백업 내보내기</button>
        <button class="btn-outline" data-act="import">백업 불러오기</button>
      </div>
      <input type="file" id="import-file" accept="application/json,.json" class="hidden">
      <p class="hint" id="persist-note" style="margin:10px 0 0"></p>
    </section>
  </main>${tabbar('settings')}`;
}

/* ================= 화면: 추가하기 / 수정하기 ================= */
function startEdit(id) {
  const e = id ? S.entries.find((x) => x.id === id) : null;
  S.edit = e
    ? { id: e.id, occurredAt: localDT(e.occurredAt), type: e.type, payment: e.payment || 'CASH', amount: String(e.amount),
        categoryId: S.categories.some((c) => c.id === e.categoryId) ? e.categoryId : null,
        summary: e.summary, detail: e.detail, attachment: e.attachment || null, createdAt: e.createdAt, showErrors: false }
    : { id: null, occurredAt: localDT(Date.now()), type: 'EXPENSE', payment: 'CASH', amount: '', categoryId: null,
        summary: '', detail: '', attachment: null, createdAt: null, showErrors: false };
}
function viewEdit() {
  const f = S.edit;
  const amtErr = f.showErrors && !(+f.amount > 0);
  const catErr = f.showErrors && f.categoryId == null;
  return `
  <header class="bar"><button class="back" data-act="back" aria-label="뒤로">←</button><h1>${f.id ? '수정하기' : '추가하기'}</h1></header>
  <main class="no-tab">
    <label class="field"><span class="label">날짜</span>
      <input type="datetime-local" id="f-date" value="${f.occurredAt}"></label>
    <div class="field"><span class="label">구분</span>
      <div class="seg" id="f-type">${Object.entries(TYPE).map(([k, l]) => `<button type="button" data-type="${k}" class="${f.type === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="field ${f.type === 'EXPENSE' ? '' : 'hidden'}" id="f-pay-wrap"><span class="label">결제수단</span>
      <div class="seg" id="f-pay">${Object.entries(PAY).map(([k, l]) => `<button type="button" data-pay="${k}" class="${f.payment === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <label class="field ${amtErr ? 'has-error' : ''}"><span class="label">금액</span>
      <div class="with-suffix"><input type="text" inputmode="numeric" id="f-amount" placeholder="0" value="${f.amount ? num(f.amount) : ''}"><span class="suffix">원</span></div>
      ${amtErr ? '<div class="error-text">금액을 입력해 주세요</div>' : ''}</label>
    <label class="field ${catErr ? 'has-error' : ''}"><span class="label">카테고리</span>
      <select id="f-cat"><option value="">선택해 주세요</option>${S.categories.map((c) => `<option value="${c.id}" ${c.id === f.categoryId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      ${catErr ? '<div class="error-text">카테고리를 선택해 주세요</div>' : ''}
      ${S.categories.length ? '' : '<div class="hint">설정에서 카테고리를 먼저 만들어 주세요</div>'}</label>
    <label class="field"><span class="label">요약</span>
      <input type="text" id="f-summary" maxlength="${MAX_SUMMARY}" value="${esc(f.summary)}">
      <div class="counter" id="c-summary">${f.summary.length}/${MAX_SUMMARY}</div></label>
    <label class="field"><span class="label">상세 내역</span>
      <textarea id="f-detail" maxlength="${MAX_DETAIL}">${esc(f.detail)}</textarea>
      <div class="counter" id="c-detail">${f.detail.length}/${MAX_DETAIL}</div></label>
    <div class="field"><span class="label">사진 / 파일 첨부 (1개)</span>
      ${f.attachment ? `<div class="attach-box"><span>${esc(f.attachment.name)}</span><button class="icon-btn" data-act="attach-remove" aria-label="첨부 삭제">✕</button></div>` : ''}
      <div class="btn-row">
        <button type="button" class="btn-outline" data-act="pick-photo">${f.attachment ? '사진으로 교체' : '+ 사진'}</button>
        <button type="button" class="btn-outline" data-act="pick-file">${f.attachment ? '파일로 교체' : '+ 파일'}</button>
      </div>
      <input type="file" id="f-photo" accept="image/*" class="hidden">
      <input type="file" id="f-file" class="hidden"></div>
    <button class="btn-accent save" data-act="save">저장</button>
  </main>`;
}

async function saveEdit() {
  const f = S.edit;
  const amount = +f.amount;
  // 필수: 구분(항상 선택됨) · 금액 · 카테고리
  if (!(amount > 0) || f.categoryId == null) {
    f.showErrors = true;
    render();
    return;
  }
  const occurred = new Date(f.occurredAt).getTime();
  const entry = {
    occurredAt: Number.isFinite(occurred) ? occurred : Date.now(),
    type: f.type,
    payment: f.type === 'EXPENSE' ? f.payment : null,
    amount,
    categoryId: f.categoryId,
    summary: f.summary.trim().slice(0, MAX_SUMMARY),
    detail: f.detail.trim().slice(0, MAX_DETAIL),
    attachment: f.attachment,
    createdAt: f.createdAt || Date.now(),
  };
  if (f.id) entry.id = f.id;
  try {
    await putOne('entries', entry);
  } catch (err) {
    toast('저장하지 못했어요: ' + (err && err.message ? err.message : '알 수 없는 오류'));
    return;
  }
  await loadAll();
  S.edit = null;
  history.back();
}

/* ================= 화면: 건별 상세 ================= */
function viewDetail(id) {
  const e = S.entries.find((x) => x.id === id);
  if (!e) return `<header class="bar"><button class="back" data-act="back">←</button><h1>상세</h1></header><main class="no-tab"><div class="empty">내역을 찾을 수 없어요</div></main>`;
  const a = e.attachment;
  let attach = '';
  if (a) {
    const url = blobUrl(a.blob);
    attach = (a.mime || '').startsWith('image/')
      ? `<img class="thumb" src="${url}" alt="${esc(a.name)}" data-act="zoom"><div class="hint" style="margin-top:4px">사진을 누르면 크게 볼 수 있어요</div>`
      : `<div class="attach-box"><span>${esc(a.name)}</span><a class="btn-outline" href="${url}" target="_blank" rel="noopener">열기</a><a class="btn-outline" href="${url}" download="${esc(a.name)}">저장</a></div>`;
  }
  return `
  <header class="bar"><button class="back" data-act="back" aria-label="뒤로">←</button><h1>상세</h1>
    <a class="btn-text" href="#/edit/${e.id}">수정</a><button class="btn-text danger" data-act="detail-del" data-id="${e.id}">삭제</button></header>
  <main class="no-tab">
    <div class="l1"><span class="chip ${e.type}">${TYPE[e.type]}</span><span class="hint" style="font-size:15px">${esc(catName(e.categoryId))}</span></div>
    <div class="big-amt">${e.type === 'EXPENSE' ? '−' : '+'}${won(e.amount)}</div>
    <section class="card">
      <div class="kv"><span class="k">날짜</span><span class="v">${fullMs(e.occurredAt)}</span></div>
      <div class="kv"><span class="k">구분</span><span class="v">${TYPE[e.type]}</span></div>
      ${e.payment ? `<div class="kv"><span class="k">결제수단</span><span class="v">${PAY[e.payment]}</span></div>` : ''}
      <div class="kv"><span class="k">카테고리</span><span class="v">${esc(catName(e.categoryId))}</span></div>
      <div class="kv"><span class="k">요약</span><span class="v">${esc(e.summary || '—')}</span></div>
    </section>
    <h2 class="sec">상세 내역</h2>
    <div class="detail-text">${esc(e.detail || '—')}</div>
    ${a ? `<h2 class="sec">첨부</h2>${attach}` : ''}
  </main>`;
}

/* ================= 라우팅 ================= */
function route() {
  const parts = (location.hash || '#/home').slice(2).split('/');
  return { name: parts[0] || 'home', id: parts[1] ? Number(parts[1]) : null };
}
function render() {
  objectUrls.forEach((u) => URL.revokeObjectURL(u));
  objectUrls = [];
  const r = route();
  let html;
  switch (r.name) {
    case 'history': html = viewHistory(); break;
    case 'stats': html = viewStats(); break;
    case 'settings': html = viewSettings(); break;
    case 'edit':
      if (!S.edit || S.edit.id !== r.id) startEdit(r.id);
      html = viewEdit(); break;
    case 'detail': html = viewDetail(r.id); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
  if (r.name === 'settings') showPersistNote();
}
window.addEventListener('hashchange', () => {
  if (!route().name.startsWith('edit')) S.edit = null;
  S.periodEditing = false;
  render();
  window.scrollTo(0, 0);
});

/* ================= 이벤트 ================= */
app.addEventListener('click', async (ev) => {
  const t = ev.target;
  const del = t.closest('[data-del]');
  if (del) {
    ev.stopPropagation();
    const e = S.entries.find((x) => x.id === +del.dataset.del);
    if (e && await confirmDelete('삭제할까요?', `‘${e.summary || won(e.amount)}’ 내역을 지우면 되돌릴 수 없어요.`)) {
      await delOne('entries', e.id); await loadAll(); render();
    }
    return;
  }
  const open = t.closest('[data-open]');
  if (open) { location.hash = `#/detail/${open.dataset.open}`; return; }

  const filter = t.closest('[data-filter]');
  if (filter) {
    S.history.filter = filter.dataset.filter;
    document.querySelectorAll('.filters button').forEach((b) => b.classList.toggle('on', b === filter));
    document.getElementById('h-list').innerHTML = historyListHtml();
    return;
  }
  const typeBtn = t.closest('[data-type]');
  if (typeBtn) {
    S.edit.type = typeBtn.dataset.type;
    document.querySelectorAll('#f-type button').forEach((b) => b.classList.toggle('on', b === typeBtn));
    document.getElementById('f-pay-wrap').classList.toggle('hidden', S.edit.type !== 'EXPENSE');
    return;
  }
  const payBtn = t.closest('[data-pay]');
  if (payBtn) {
    S.edit.payment = payBtn.dataset.pay;
    document.querySelectorAll('#f-pay button').forEach((b) => b.classList.toggle('on', b === payBtn));
    return;
  }
  const catEdit = t.closest('[data-cat-edit]');
  if (catEdit) return renameCategory(+catEdit.dataset.catEdit);
  const catDel = t.closest('[data-cat-del]');
  if (catDel) return deleteCategory(+catDel.dataset.catDel);

  const act = t.closest('[data-act]');
  if (!act) return;
  const s = S.settings;
  switch (act.dataset.act) {
    case 'back': history.length > 1 ? history.back() : (location.hash = '#/home'); break;
    case 'toggle': s.collapsed = !s.collapsed; await saveSettings(); render(); break;
    case 'period-prev': case 'period-next': {
      [s.start, s.end] = shiftPeriod(s.start, s.end, act.dataset.act === 'period-next' ? 1 : -1);
      await saveSettings(); render(); break;
    }
    case 'period-edit': S.periodEditing = !S.periodEditing; render(); break;
    case 'period-apply': {
      const a = document.getElementById('p-start').value, b = document.getElementById('p-end').value;
      if (!a || !b) return toast('시작일과 종료일을 모두 골라 주세요');
      [s.start, s.end] = a <= b ? [a, b] : [b, a];
      S.periodEditing = false; await saveSettings(); render(); break;
    }
    case 'budget': {
      let value = s.budget;
      const v = await modal({
        title: '예산 입력',
        bodyHtml: `<div class="with-suffix"><input type="text" inputmode="numeric" class="input" id="m-budget" value="${s.budget ? num(s.budget) : ''}" placeholder="0"><span class="suffix">원</span></div>`,
        buttons: [{ label: '취소', value: null }, {
          label: '저장', value: 'ok', cls: 'btn-accent',
          check: (root) => { value = +digitsOf(root.querySelector('#m-budget').value) || 0; return true; },
        }],
        onOpen: (root) => {
          const inp = root.querySelector('#m-budget');
          inp.addEventListener('input', () => { const d = digitsOf(inp.value); inp.value = d ? num(d) : ''; });
          inp.focus();
        },
      });
      if (v === 'ok') { s.budget = value; await saveSettings(); render(); }
      break;
    }
    case 'stats-reset': S.stats = { start: s.start, end: s.end }; render(); break;
    case 'cat-add': return addCategory();
    case 'export': return exportBackup();
    case 'import': document.getElementById('import-file').click(); break;
    case 'pick-photo': document.getElementById('f-photo').click(); break;
    case 'pick-file': document.getElementById('f-file').click(); break;
    case 'attach-remove': S.edit.attachment = null; render(); break;
    case 'save': return saveEdit();
    case 'zoom': {
      const v = document.createElement('div');
      v.className = 'viewer';
      v.innerHTML = `<img src="${act.getAttribute('src')}" alt="">`;
      v.addEventListener('click', () => v.remove());
      document.body.appendChild(v);
      break;
    }
    case 'detail-del': {
      const e = S.entries.find((x) => x.id === +act.dataset.id);
      if (e && await confirmDelete('삭제할까요?', '이 내역과 첨부 파일이 함께 지워지고 되돌릴 수 없어요.')) {
        await delOne('entries', e.id); await loadAll(); history.back();
      }
      break;
    }
  }
});

app.addEventListener('input', (ev) => {
  const t = ev.target, f = S.edit;
  switch (t.id) {
    case 'f-date': f.occurredAt = t.value; break;
    case 'f-amount': { const d = digitsOf(t.value); f.amount = d; t.value = d ? num(d) : ''; break; }
    case 'f-summary': f.summary = t.value.slice(0, MAX_SUMMARY); document.getElementById('c-summary').textContent = `${f.summary.length}/${MAX_SUMMARY}`; break;
    case 'f-detail': f.detail = t.value.slice(0, MAX_DETAIL); document.getElementById('c-detail').textContent = `${f.detail.length}/${MAX_DETAIL}`; break;
    case 'h-search': S.history.query = t.value; document.getElementById('h-list').innerHTML = historyListHtml(); break;
  }
});

app.addEventListener('change', async (ev) => {
  const t = ev.target;
  switch (t.id) {
    case 'f-cat': S.edit.categoryId = t.value ? +t.value : null; break;
    case 'f-photo': case 'f-file': {
      const file = t.files && t.files[0];
      if (file) {
        S.edit.attachment = { name: file.name, mime: file.type || '', blob: file };
        render();
      }
      break;
    }
    case 's-start': case 's-end': {
      const a = document.getElementById('s-start').value, b = document.getElementById('s-end').value;
      if (a && b) { S.stats = a <= b ? { start: a, end: b } : { start: b, end: a }; render(); }
      break;
    }
    case 'import-file': {
      const file = t.files && t.files[0];
      t.value = '';
      if (file) await importBackup(file);
      break;
    }
  }
});

/* ================= 카테고리 ================= */
function validateName(name, excludeId) {
  if (!name) return '카테고리 이름을 입력해 주세요';
  if (name.length > MAX_CAT) return `카테고리 이름은 ${MAX_CAT}자까지예요`;
  if (S.categories.some((c) => c.name === name && c.id !== excludeId)) return '이미 있는 카테고리예요';
  return null;
}
async function addCategory() {
  const inp = document.getElementById('cat-new');
  const name = inp.value.trim();
  const err = validateName(name, null);
  if (err) return toast(err);
  const maxOrder = Math.max(-1, ...S.categories.map((c) => c.sortOrder));
  await putOne('categories', { name, sortOrder: maxOrder + 1 });
  await loadAll(); render();
}
async function renameCategory(id) {
  const c = S.categories.find((x) => x.id === id);
  if (!c) return;
  let newName = c.name;
  const v = await modal({
    title: '카테고리 이름 바꾸기',
    message: '기존 내역에도 새 이름으로 보여요.',
    bodyHtml: `<input type="text" class="input" id="m-cat" maxlength="${MAX_CAT}" value="${esc(c.name)}"><div class="error-text" id="m-cat-err"></div>`,
    buttons: [{ label: '취소', value: null }, {
      label: '저장', value: 'ok', cls: 'btn-accent',
      check: (root) => {
        newName = root.querySelector('#m-cat').value.trim();
        const err = newName === c.name ? null : validateName(newName, c.id);
        root.querySelector('#m-cat-err').textContent = err || '';
        return !err;
      },
    }],
    onOpen: (root) => root.querySelector('#m-cat').focus(),
  });
  if (v === 'ok' && newName !== c.name) {
    await putOne('categories', { ...c, name: newName });
    await loadAll(); render();
  }
}
async function deleteCategory(id) {
  const c = S.categories.find((x) => x.id === id);
  if (!c) return;
  const used = S.entries.filter((e) => e.categoryId === id);
  const ok = await confirmDelete(`‘${c.name}’ 삭제`,
    used.length ? `이 카테고리를 쓴 내역 ${used.length}건은 지워지지 않고 ‘${UNCAT}’로 남아요.` : '이 카테고리를 삭제할까요?');
  if (!ok) return;
  // 카테고리를 지우면 그 카테고리를 쓰던 내역은 '미분류'
  await run(['entries', 'categories'], 'readwrite', (t) => {
    used.forEach((e) => t.objectStore('entries').put({ ...e, categoryId: null }));
    t.objectStore('categories').delete(id);
  });
  await loadAll(); render();
}

/* ================= 백업 ================= */
const blobToDataUrl = (blob) => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob);
});
async function exportBackup() {
  const entries = await Promise.all(S.entries.map(async (e) => ({
    ...e,
    attachment: e.attachment ? { name: e.attachment.name, mime: e.attachment.mime, data: await blobToDataUrl(e.attachment.blob) } : null,
  })));
  const data = { app: 'don-moeuja', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, categories: S.categories, entries };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `돈모으자-백업-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('백업 파일을 저장했어요');
}
async function importBackup(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
    if (data.app !== 'don-moeuja' || !Array.isArray(data.entries) || !Array.isArray(data.categories)) throw new Error();
  } catch {
    return toast('레이야 돈 모으자 백업 파일이 아니에요');
  }
  const ok = await modal({
    title: '백업 불러오기',
    message: `지금 폰에 있는 내용은 모두 지워지고 백업 파일 내용(내역 ${data.entries.length}건)으로 바뀌어요.`,
    buttons: [{ label: '취소', value: false }, { label: '불러오기', value: true, cls: 'btn-text danger' }],
  });
  if (!ok) return;
  const entries = await Promise.all(data.entries.map(async (e) => ({
    ...e,
    attachment: e.attachment && e.attachment.data
      ? { name: e.attachment.name, mime: e.attachment.mime, blob: await (await fetch(e.attachment.data)).blob() } : null,
  })));
  await run(['entries', 'categories', 'kv'], 'readwrite', (t) => {
    ['entries', 'categories'].forEach((n) => t.objectStore(n).clear());
    data.categories.forEach((c) => t.objectStore('categories').put(c));
    entries.forEach((e) => t.objectStore('entries').put(e));
    if (data.settings) t.objectStore('kv').put({ key: 'settings', value: data.settings });
  });
  await loadAll(); S.stats = null; render();
  toast('백업을 불러왔어요');
}

/* ================= 저장공간 보호 ================= */
async function showPersistNote() {
  const el = document.getElementById('persist-note');
  if (!el || !navigator.storage || !navigator.storage.persisted) return;
  const on = await navigator.storage.persisted();
  el.textContent = on ? '저장공간 보호: 켜짐 (크롬이 공간 부족으로 자동 삭제하지 않아요)' : '저장공간 보호: 꺼짐 — 홈 화면에 앱을 추가하면 켜질 가능성이 높아요';
}

/* ================= 시작 ================= */
(async function start() {
  try {
    db = await openDB();
    await loadAll();
  } catch (err) {
    app.innerHTML = `<main><div class="empty">저장소를 열 수 없어요.\n시크릿 모드라면 일반 창에서 열어 주세요.</div></main>`;
    return;
  }
  if (!location.hash) history.replaceState(null, '', '#/home');
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
